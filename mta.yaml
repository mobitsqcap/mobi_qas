_schema-version: 3.3.0
ID: mobi_dev_cap
description: A simple CAP project.
version: 1.0.0

modules:
  - name: mobi_dev_cap-srv
    type: nodejs
    path: .
    requires:
      - name: mobi_dev_cap-auth
      - name: mobi_dev_cap-db
      - name: mobi_job_scheduler
      - name: sftp-mobi-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      app-name: mobi-cap-srv-${space}
    build-parameters:
      builder: npm-ci

  - name: mobi_dev_cap-approuter
    type: approuter.nodejs
    path: approuter
    requires:
      - name: mobi_dev_cap-auth
      - name: mobi_dev_cap-destination-service
      - name: mobi_dev_cap-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: sftp-mobi-destination
        group: destinations
        properties:
          forwardAuthToken: false
          name: ui5
          url: https://ui5.sap.com
    parameters:
      disk-quota: 512M
      memory: 512M
      app-name: mobi-cap-approuter-${space}

  - name: mobi_dev_cap-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: mobi_dev_cap-db
    parameters:
      buildpack: nodejs_buildpack
      app-name: mobi-cap-db-deployer-${space}

  - name: mobi_dev_cap-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: mobi_dev_cap-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: glvlookup
        - artifacts:
            - glvlookup.zip
          name: glvlookup
          target-path: resources/

        - artifacts:
            - masterbpupload.zip
          name: masterbpupload
          target-path: resources/

  - name: glvlookup
    type: html5
    path: app/gl_vlookup
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: masterbpupload
    type: html5
    path: app/masterbpupload
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  - name: mobi_dev_cap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: mobi-cap-xsuaa-${space}
      path: ./xs-security.json
      config:
        tenant-mode: dedicated
        xsappname: mobi-cap-${space}

  - name: mobi_dev_cap-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: mobi-cap-hdi-${space}

  - name: mobi_dev_cap-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: mobi-cap-html5-host-${space}

  - name: mobi_dev_cap-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
      service-name: mobi-cap-html5-runtime-${space}

  - name: mobi_dev_cap-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: mobi-cap-destination-${space}
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:

              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://sap.com

              - Name: glvlookup-html5
                Type: HTTP
                ProxyType: Internet
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                HTML5.ForwardAuthToken: true
                sap.cloud.service: fiori.service
                html5-apps-repo.app_host_id: 2a04945e-679a-4d72-8548-206712a65de5

              - Name: masterbpupload-html5
                Type: HTTP
                ProxyType: Internet
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                HTML5.ForwardAuthToken: true
                html5-apps-repo.app_host_id: 2a04945e-679a-4d72-8548-206712a65de5

            existing_destinations_policy: update
        version: 1.0.0

  - name: mobi_job_scheduler
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: mobi_job_qas
      

  - name: sftp-mobi-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: sftp-mobi-destination

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production