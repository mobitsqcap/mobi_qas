_schema-version: 3.3.0
ID: mobi_dev_cap
description: A simple CAP project.
version: 1.0.0
modules:
- name: mobi_dev_cap-srv
  type: nodejs
  path: .
  requires:
  - name: mobi_dev_cap-auth
  - name: mobi_dev_cap-db
  - name: mobi_job_dev
  - name: sftp-mobi-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}m
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: mobi_dev_cap-approuter
  type: approuter.nodejs
  path: approuter
  requires:
  - name: mobi_dev_cap-auth
  - name: mobi_dev_cap-destination-service
  - name: mobi_dev_cap-repo-runtime
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: sftp-mobi-destination
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  parameters:
    disk-quota: 512M
    memory: 512M
- name: mobi_dev_cap-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: mobi_dev_cap-db
  parameters:
    buildpack: nodejs_buildpack
- name: mobi_dev_cap-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: mobi_dev_cap-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - glvlookup.zip
      name: glvlookup
      target-path: resources/
    - artifacts:
      - displayglvlookup.zip
      name: displayglvlookup
      target-path: resources/
- name: glvlookup
  type: html5
  path: app/gl_vlookup
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: displayglvlookup
  type: html5
  path: app/display_glvlookup
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: mobi_dev_cap-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: mobi_dev_cap-MOBIVERSA_PRIVATE_LIMITED-Mobi_dev_space
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: mobi_dev_cap-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: mobi_dev_cap-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: mobi_dev_cap-html5-service
    service-plan: app-host
- name: mobi_dev_cap-repo-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: mobi_dev_cap-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: mobi_dev_cap-destination-service
    service-plan: lite
- name: mobi_job_dev
  type: org.cloudfoundry.existing-service
- name: sftp-mobi-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
